  <div class="tabs fixed-bottom w-100">

      <!-- Background -->
      <div class="bg-tabs">
        <img
          [src]="_ThemeService.isDark() ? 'assets/images/tabs/tabs-background-black.png' : 'assets/images/tabs/tabs-background-white.png'"
          alt="XPRS Logo"
          class="rounded-top-4"
        >
      </div>

      <!-- Tabs -->
      <ul class="tab-list list-unstyled mb-0">

        <li class="tab-item" routerLink="/home">
          <i class="fa-solid fa-compass"></i>
          <span>Discover</span>
        </li>

        <li class="tab-item" routerLink="/categories">
          <i class="fa-solid fa-layer-group"></i>
          <span>Categories</span>
        </li>

        <!-- Center Button -->
        <li class="tab-item center-tab" routerLink="/search">
          <div class="center-icon" [ngStyle]="{
            'background' : _ThemeService.isDark() ? '#000' : '#F8F8F8'
          }">
            <img
              [src]="_ThemeService.isDark() ? 'assets/images/tabs/brands_active_dark.svg' : 'assets/images/tabs/brands_active_light.svg'"
              alt="XPRS Logo"
              class="rounded-top-4"
            >
          </div>
        </li>

        <li class="tab-item" routerLink="/notifications">
          <i class="fa-regular fa-bell"></i>
          <span>Notifications</span>
        </li>

        <li class="tab-item" routerLink="/profile">
          <i class="fa-regular fa-user"></i>
          <span>Profile</span>
        </li>

      </ul>

    </div>
