<div class="swiper specialOffers-slider mt-4">
  <h2 class="m-0 mb-2 main-color">{{specialOffers.title}}</h2>

  <swiper-container slides-per-view="2" space-between="10" class="swiper-wrapper">
    @for (item of specialOffers?.products; track $index) {
      <swiper-slide class="rounded-4 h-100">
        <div class="offer-silde rounded-4">

          <div class="card-image position-relative">
            <img loading="lazy"[src]="item?.picture1 || 'assets/icon/xprs_spinner.gif'" [alt]="item?.picture1_alt" class="offer-img rounded-0 cr" [routerLink]="'/product/' + item.id"/>

            <span class="icon-option position-absolute d-flex flex-column gap-1 top-0 start-0 p-1">
                <i
                  (click)="addToFavorite(item)"
                  class="ms-1"
                  [ngClass]="
                    isFavorite(item)
                      ? 'fa-solid fa-heart main-color'
                      : 'fa-regular fa-heart main-color'
                  "
                ></i>
            </span>

            <span class="stock-msg position-absolute top-0 end-0 p-1">
              @if(item?.availability != 'In Stock'){
                <span class="badge bg-danger text-white fs-13">
                  Sold Out
                </span>
              } @else{
                <span class="badge main-bg text-white fs-13">
                  In Stock
                </span>
              }
            </span>

            <span class="main-color fade-fave" [ngClass]="{'animate-fade': showFadeAnimation(item)}">
              <i class="fa-solid fa-heart main-color"></i>
            </span>
          </div>

          <div class="p-2" [routerLink]="'/product/' + item.id">
            <h6 class="m-0 product-title">{{ item.name.slice(0,30) }}...</h6>
          </div>

          <div class="d-flex justify-content-between align-items-center p-2 pt-0" >
            <p class="m-0 p-0 main-color price">
              {{ item.price | number }} EGP
            </p>
            @if (item?.availability == 'In Stock') {
              <ion-button
                fill="clear"
                (click)="addToCart(item)"
                class="btn-add"
              >
                <i
                  class="fa-solid"
                  [ngClass]="{
                    'fa-cart-shopping main-bg text-white': isCart(item),
                    'fa-cart-arrow-down main-color': !isCart(item)
                  }"
                ></i>
              </ion-button>
            }
          </div>
        </div>
      </swiper-slide>
    }
  </swiper-container>
</div>
