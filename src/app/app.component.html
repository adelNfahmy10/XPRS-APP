<ion-app>
  <ion-split-pane contentId="main-content">
    <ion-menu contentId="main-content" type="overlay">
      <ion-content class="position-relative">
        <ion-list id="inbox-list">
          <div class="head-menu d-flex align-items-center gap-3 pb-2 mb-4">
            <div class="logo">
              <img
                [src]="_ThemeService.isDark() ? 'assets/images/menubar-image/logo-dark-mode.png' : 'assets/images/menubar-image/logo-light-mode.png'"
                alt="xprs"
                class="logo-img"
              >
            </div>

            <div class="header-title h-100">
              <h4 class="mb-0 main-color">Welcome Back!</h4>
            </div>

          </div>
          @for (p of appPages; track p; let i = $index) {
            <ion-menu-toggle auto-hide="false">
              <ion-item routerDirection="root" [routerLink]="[p.url]" lines="none" detail="false" routerLinkActive="selected">
                <ion-label>
                  <div class="d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center gap-2 w-100">
                      <span>{{ p.title }}</span>
                      @if(p.title == 'My Favorites'){
                        <span class="favCount fw-bold">
                          {{ favCount() }}
                        </span>
                      }
                    </div>
                    <i class="fa-solid fa-chevron-right"></i>
                  </div>
                </ion-label>
              </ion-item>
            </ion-menu-toggle>
          }
        </ion-list>

        <div class="toggle-theme w-100 d-flex justify-content-between align-items-center position-absolute bottom-0 start-0 px-2">
          <div class="img-logo">
            <img
              [src]="_ThemeService.isDark() ? 'assets/images/menubar-image/logo-dark-mode.png' : 'assets/images/menubar-image/logo-light-mode.png'"
              alt="xprs"
              class="logo-img"
            >
          </div>

          <div class="toggle-img mx-3">
            <i
              (click)="changeTheme()"
              [class]="_ThemeService.isDark() ? 'fa-solid fa-moon' : 'fa-solid fa-sun'">
            </i>
          </div>
        </div>

        <!-- <ion-list id="labels-list">
          <ion-list-header>Labels</ion-list-header>

          @for (label of labels; track label) {
            <ion-item lines="none">
              <ion-icon aria-hidden="true" slot="start" ios="bookmark-outline" md="bookmark-sharp"></ion-icon>
              <ion-label>{{ label }}</ion-label>
            </ion-item>
          }
        </ion-list> -->
      </ion-content>
    </ion-menu>
    <ion-router-outlet id="main-content"></ion-router-outlet>
    <ngx-spinner bdColor = "rgba(0, 0, 0, .9)" size = "large" color = "#000" [fullScreen] = "true">
      <div class="text-center logo-spinner-container">
        <img src="assets/icon/xprs_spinner.gif" class="w-100" alt="XPRS">
      </div>
    </ngx-spinner>
  </ion-split-pane>
</ion-app>
