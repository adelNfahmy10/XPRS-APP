<ion-header [translucent]="true">
  <ion-toolbar>

    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>

    <ion-title class="text-center">Profile</ion-title>

    <ion-buttons slot="end">
      <div routerLink="/cart" class="cart-bar mx-2 position-relative text-center">
        <i class="fa-solid fa-cart-shopping"></i>
        <app-cart-bar></app-cart-bar>
      </div>
    </ion-buttons>

  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
    <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content
      pullingIcon="arrow-down"
      refreshingSpinner="circles">
    </ion-refresher-content>
  </ion-refresher>

  <section class="profile p-3 rounded-3">
    @if(!token()){
      <div class="auth-card p-3 border text-center rounded-4">
        <div class="img-user">
          <img loading="lazy" src="assets/icon/user-default.png" class="rounded-circle mb-3" alt="XPRS User Logo">
        </div>

        <div class="msg-user">
          <p>Please Login to get the best experience of Shop Online</p>
          <button class="btn main-bg px-5 py-1 text-white rounded-5" routerLink="/login">Login</button>
        </div>
      </div>
    } @else {
      <div class="auth-card rounded-4">
        <div class="img-user text-center">
          <img loading="lazy" src="assets/icon/user-default.png" class="rounded-circle mb-3" alt="XPRS User Logo">
          <h4 class="m-0">{{userName}}</h4>
        </div>

        <div class="profile-list">
          <ul class="list-unstyled mt-3">
            <li class="border-bottom py-2 mb-2">
              <div class="d-flex justify-content-between align-items-center" routerLink="/orders">
                <span>Orders</span>
                <i class="fa-solid fa-chevron-right"></i>
              </div>
            </li>
            <li class="border-bottom py-2 mb-2">
              <div class="d-flex justify-content-between align-items-center">
                <span>TVC | Loyalty Points</span>
                <i class="fa-solid fa-chevron-right"></i>
              </div>
            </li>
            <li class="border-bottom py-2 mb-2">
              <div class="d-flex justify-content-between align-items-center" routerLink="/favorites">
                <span>Favoirtes</span>
                <i class="fa-solid fa-chevron-right"></i>
              </div>
            </li>
            <li class="border-bottom py-2 mb-2">
              <div class="d-flex justify-content-between align-items-center" routerLink="/privacy">
                <span>Shipping Instructions</span>
                <i class="fa-solid fa-chevron-right"></i>
              </div>
            </li>
            <li class="border-bottom py-2 mb-2">
              <div class="d-flex justify-content-between align-items-center" routerLink="/contact-us">
                <span>Help & Contact</span>
                <i class="fa-solid fa-chevron-right"></i>
              </div>
            </li>
            <li class="border-bottom py-2 mb-2">
              <div class="d-flex justify-content-between align-items-center" routerLink="/about">
                <span>About</span>
                <i class="fa-solid fa-chevron-right"></i>
              </div>
            </li>

             <li class="border-bottom border-danger py-2 mb-2">
              <div class="d-flex justify-content-between align-items-center text-danger" (click)="logout()">
                <span class="text-danger">Logout</span>
                <i class="fa-solid fa-chevron-right"></i>
              </div>
            </li>

            <!-- <li class="py-2 mb-2">
              <div class="d-flex justify-content-between align-items-center text-danger">
                <span>Delete Account</span>
                <i class="fa-solid fa-chevron-right"></i>
              </div>
            </li> -->
          </ul>
        </div>
      </div>
    }
  </section>
</ion-content>
