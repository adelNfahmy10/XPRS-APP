<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Contact Us</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
    <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content
      pullingIcon="arrow-down"
      refreshingSpinner="circles">
    </ion-refresher-content>
  </ion-refresher>

  <div class="contact-us p-3">
    <div class="contact-title">
      <h3>Get In Touch</h3>
    </div>

    <div class="contact-text">
      <p>
        <span class="main-color" routerLink="/store-locator">Locate the store nearest to you</span> or fill the form below and we'll get back to you.
      </p>
    </div>

    <div class="contact-form">
      <form class="d-flex flex-column gap-3" [formGroup]="contactUsForm" (ngSubmit)="submitContactUs()">
        <div class="name">
          <label class="mb-2" for="name">Name</label>
          <input formControlName="name" class="form-control bg-transparent border-white" type="text" name="name" id="name">
        </div>

        <div class="email">
          <label class="mb-2" for="email">Email</label>
          <input formControlName="email" class="form-control bg-transparent border-white" type="email" name="email" id="email">
        </div>

        <div class="phone">
          <label class="mb-2" for="phone">Phone Number</label>
          <input formControlName="phone_number" class="form-control bg-transparent border-white" type="tel" name="phone" id="phone">
        </div>

        <div class="message">
          <label class="mb-2" for="message">Your Message</label>
          <textarea formControlName="text" class="form-control bg-transparent border-white" name="message" id="message"></textarea>
        </div>

        <div class="sumbit text-center">
          <button class="btn btn-submit text-white rounded-4" [disabled]="contactUsForm.invalid">SEND A MESSAGE</button>
        </div>
      </form>
    </div>


  </div>
</ion-content>
