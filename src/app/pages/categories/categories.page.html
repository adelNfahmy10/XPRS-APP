<ion-header [translucent]="true">
  <ion-toolbar>

    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>

    <ion-title class="text-center">Categories</ion-title>

    <ion-buttons slot="end">
      <div routerLink="/cart" class="cart-bar mx-2 position-relative text-center">
        <i class="fa-solid fa-cart-shopping"></i>
        <app-cart-bar></app-cart-bar>
      </div>
    </ion-buttons>

  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
    <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content
      pullingIcon="arrow-down"
      refreshingSpinner="circles">
    </ion-refresher-content>
  </ion-refresher>

  <div class="row g-3 p-3">
    @for (cat of categories; track $index) {
      <div class="col-6">
          <div class="category-box text-center rounded-4 cr h-100">
            <div class="rounded-4 h-100" [routerLink]="'/products/category/' + cat.id">
              <img
                [routerLink]="'/products/category/' + cat.id"
                [src]="cat.picture || 'assets/icon/xprs_spinner.gif'"
                [alt]="cat.name"
                loading="lazy"
                class="img-fluid rounded-4"
              />

              <p class="text-center slide-title my-2">{{cat.name}}</p>
            </div>
          </div>
      </div>
    }
  </div>

  <app-tabs></app-tabs>
</ion-content>
