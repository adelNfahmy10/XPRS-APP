<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Delivery</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
    <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content
      pullingIcon="arrow-down"
      refreshingSpinner="circles">
    </ion-refresher-content>
  </ion-refresher>

  <div class="privacy p-3">
    <div class="privacy-image mb-4">

      <img
        [src]="_ThemeService.isDark() ? 'assets/images/delivery-image/shipping-dark.png' : 'assets/images/delivery-image/shipping-light.png'"
        alt="delivery"
      >
    </div>

    <div class="privacy-content">
      @for (item of deliveryContent; track $index) {
        <div class="delivery-title">
          <h3 class="main-color" [innerHTML]="item.title"></h3>
        </div>

        <div class="delivery-text" [innerHTML]="item.description">
        </div>
      }
    </div>
  </div>
</ion-content>
